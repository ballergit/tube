<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vexa — Upload</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body><header class="site-header"><div class="header-inner"><button class="menu-btn" id="menuBtn">☰</button><a class="brand" href="index.html">Vexa</a><div class="header-actions"><button class="icon-btn" id="themeBtn">🌙</button></div></div></header><main class="main auth-wrap"><form class="form" id="uploadForm"><h1>Upload content</h1><p class="muted">User submissions are reviewed by an admin before publication.</p><div class="field"><label>Type</label><select id="contentType"><option value="video">Video</option><option value="photo">Photo</option></select></div><div class="field"><label>File</label><input id="mediaFile" type="file" accept="video/*,image/*" required></div><div class="field"><label>Thumbnail (optional for video)</label><input id="thumbFile" type="file" accept="image/*"></div><div class="field"><label>Title</label><input id="title" required></div><div class="field"><label>Category</label><input id="category" placeholder="e.g. Entertainment"></div><div class="field"><label>Description</label><textarea id="description" rows="5"></textarea></div><div class="field"><label>Tags</label><input id="tags" placeholder="comma,separated,tags"></div><button class="btn primary" type="submit">Upload</button><p id="msg" class="muted"></p></form></main><script src="upload.js"></script></body></html>
