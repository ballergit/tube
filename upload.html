<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vexa — Upload</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html">Vexa</a></div></header>
<main class="main auth-wrap"><form class="form" id="uploadForm"><h1>Publish a video</h1><p class="muted">This version saves video metadata and URLs. Add media hosting later when your storage provider is ready.</p>
<div class="field"><label>Title</label><input id="title" required></div><div class="field"><label>Description</label><textarea id="description" rows="5"></textarea></div><div class="field"><label>Video URL</label><input id="videoUrl" type="url" required placeholder="https://..."></div><div class="field"><label>Thumbnail URL</label><input id="thumbnailUrl" type="url"></div><div class="field"><label>Preview URL</label><input id="previewUrl" type="url"></div><div class="field"><label>Category ID</label><input id="categoryId" type="number" value="1"></div>
<button class="btn primary" type="submit">Publish</button><p id="msg" class="muted"></p></form></main><script src="upload.js"></script></body></html>
