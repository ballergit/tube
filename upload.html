<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vexa — Upload</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html">Vexa</a><div class="header-actions"><a class="header-account" href="index.html">Back to site</a></div></div></header>
<div class="layout"><aside class="sidebar"><a class="side-link" href="index.html">Home</a><a class="side-link" href="videos.html">Videos</a><a class="side-link" href="categories.html">Categories</a><a class="side-link" href="community.html">Community</a><a class="side-link" href="photos.html">Photos</a><a class="side-link" href="tags.html">Tags</a><a class="side-link active upload-link" href="upload.html">Upload</a></aside>
<main class="main"><div class="section-title"><h1>Upload content</h1><span class="page-summary">Photo or video</span></div>
<form class="form upload-form" id="uploadForm"><div class="upload-tabs" role="tablist"><button type="button" class="upload-tab active" data-type="video">Video</button><button type="button" class="upload-tab" data-type="photo">Photo</button></div>
<div class="notice">Upload an authorized photo or video file. The file is stored in your Vexa media bucket and the published content is added to the catalog.</div>
<div class="field"><label for="title">Title</label><input id="title" required></div><div class="field"><label for="description">Description</label><textarea id="description" rows="5"></textarea></div>
<div class="field"><label for="categoryId">Category</label><select id="categoryId"></select></div>
<div class="field"><label for="mediaFile">Media file</label><input id="mediaFile" type="file" accept="video/*" required><small class="muted" id="fileHint">MP4/WebM/MOV and other browser-supported video formats.</small></div>
<div class="field" id="thumbnailField"><label for="thumbnailFile">Thumbnail (optional)</label><input id="thumbnailFile" type="file" accept="image/*"></div>
<div class="field"><label for="publishDate">Content date</label><input id="publishDate" type="datetime-local"></div>
<button class="btn primary" type="submit" id="publishBtn">Publish video</button><div class="progress-wrap" id="progressWrap" hidden><div class="progress"><span id="progressBar"></span></div></div><p id="msg" class="muted"></p></form></main></div>
<script src="upload.js"></script></body></html>
