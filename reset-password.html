</div></div></header><div class="layout"><aside class="sidebar"><a class="side-link" href="index.html"><span>Home</span></a><a class="side-link" href="videos.html"><span>Videos</span></a><a class="side-link" href="photos.html"><span>Photos</span></a><a class="side-link" href="categories.html"><span>Categories</span></a><a class="side-link" href="tags.html"><span>Tags</span></a><a class="side-link" href="community.html"><span>Community</span></a><a class="side-link" href="upload.html"><span>UPLOAD</span></a></aside><main class="main auth-wrap login-page"><form class="login-form" id="resetForm"><h1>Reset Password</h1><p class="login-intro">Set a new password for your Vexa account.</p><div class="field"><label>New Password</label><input id="newPassword" type="password" autocomplete="new-password" minlength="6" required></div><div class="field"><label>Confirm Password</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="6" required></div><button class="btn primary login-submit" type="submit">Update Password</button><p id="resetMsg" class="muted" role="status"></p></form></main></div><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const c=window.supabaseClient,f=document.getElementById('resetForm'),m=document.getElementById('resetMsg');if(!c){m.textContent='Supabase is not connected.';return;}f.onsubmit=async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b){m.textContent='Passwords do not match.';return;}m.textContent='Updating…';const {error}=await c.auth.updateUser({password:a});if(error){m.textContent=error.message;return;}m.textContent='Password updated. You can now log in.';setTimeout(()=>location.href='login.html',900);};});</script></body></html>
