<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vexa — Admin</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><header class="site-header"><div class="header-inner"><button class="menu-btn" id="menuBtn">☰</button><a class="brand" href="index.html">Vexa Admin</a><div class="header-actions"><button class="icon-btn" id="themeBtn">🌙</button></div></div></header><main class="main"><div class="section-title"><h1>Pending content</h1><button class="btn" id="refresh">Refresh</button></div><p id="adminMsg" class="muted"></p><div id="pending" class="grid"></div></main><script>const c=window.supabaseClient;document.getElementById('themeBtn').onclick=()=>document.documentElement.classList.toggle('light');async function load(){const m=document.getElementById('adminMsg');const {data:{user}}=await c.auth.getUser();if(!user){location.href='login.html';return;}const {data:me,error:meErr}=await c.from('profiles').select('role').eq('id',user.id).maybeSingle();if(meErr||me?.role!=='admin'){m.textContent='Admin access required.';return;}const {data,error}=await c.from('videos').select('*').eq('status','pending').order('submitted_at',{ascending:false});if(error){m.textContent=error.message;return;}m.textContent=data.length+' pending video(s)';document.getElementById('pending').innerHTML=data.map(v=>`<article class="card"><div class="thumb"><img class="thumb-img" src="${v.thumbnail_url||'https://placehold.co/640x360/111/fff?text=Vexa'}"></div><div class="card-body"><h3>${v.title||'Untitled'}</h3><div class="card-meta">${v.uploader_name||'Creator'} · ${v.category||'General'}</div><div class="actions"><a class="btn" href="${v.video_url||'#'}" target="_blank">Preview</a><button class="btn primary" onclick="moderate(${v.id},'published')">Approve</button><button class="btn" onclick="moderate(${v.id},'rejected')">Reject</button></div></div></article>`).join('')||'<p class="muted">Nothing pending.</p>';}async function moderate(id,status){const {error}=await c.rpc('vexa_moderate_video',{p_video_id:id,p_status:status});if(error)alert(error.message);else load();}document.getElementById('refresh').onclick=load;load();</script></body></html>
