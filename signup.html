<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vexa — Sign up</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head>
<body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html">Vexa</a></div></header>
<main class="main auth-wrap"><form class="form" id="signupForm"><h1>Create account</h1><div class="field"><label>Username</label><input id="username" required minlength="3"></div><div class="field"><label>Display name</label><input id="displayName"></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required minlength="6"></div><button class="btn primary" type="submit">Create account</button><p id="msg" class="muted"></p><p>Already registered? <a href="login.html">Log in</a></p></form></main>
<script src="auth.js"></script></body></html>
