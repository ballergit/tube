<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video - Tube</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <div class="header-inner">

    <button class="menu-btn" data-menu>☰</button>

    <a class="brand" href="index.html">Tube</a>

    <div class="search">
      <input type="search" placeholder="Search videos...">
    </div>

    <div class="header-actions">
      <select class="language" data-lang>
        <option value="en">EN</option>
        <option value="fr">FR</option>
        <option value="es">ES</option>
      </select>

      <button class="icon-btn" data-theme>🌙</button>
    </div>

  </div>
</header>

<div class="overlay" data-overlay></div>

<div class="layout">

  <aside class="sidebar">

    <a class="side-link" href="index.html">🏠 <span>Home</span></a>
    <a class="side-link" href="videos.html">🎬 <span>Videos</span></a>
    <a class="side-link" href="categories.html">📂 <span>Categories</span></a>
    <a class="side-link" href="photos.html">🖼️ <span>Photos</span></a>
    <a class="side-link" href="community.html">👥 <span>Community</span></a>
    <a class="side-link" href="tags.html">🏷️ <span>Tags</span></a>

    <a class="side-link upload-link" href="upload.html">
      ⬆️ Upload
    </a>

  </aside>

  <main class="main">

    <section id="videoPage">

      <div class="video-player-wrap">

        <video
          id="mainVideo"
          class="main-video"
          controls
          playsinline
          preload="metadata"
        >
          Your browser does not support video playback.
        </video>

      </div>

      <div class="video-info">

        <h1 id="videoTitle">Loading video...</h1>

        <div class="video-meta">
          <span id="videoViews"></span>
          <span id="videoCategory"></span>
        </div>

        <div class="video-actions">

          <button class="btn" id="likeBtn">
            👍 Like <span id="likeCount">0</span>
          </button>

          <button class="btn" id="dislikeBtn">
            👎 Dislike <span id="dislikeCount">0</span>
          </button>

          <a
            class="btn"
            id="downloadBtn"
            href="#"
            download
          >
            ⬇️ Download
          </a>

        </div>

        <div class="video-tags" id="videoTags"></div>

      </div>

    </section>

    <section>

      <div class="section-title">
        <h2>Trending Videos</h2>
      </div>

      <div class="grid" id="trendingGrid"></div>

    </section>

  </main>

</div>

<footer class="footer">

  <div class="footer-grid">

    <div>
      <h3>Tube</h3>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="advertise.html">Advertise</a>
    </div>

    <div>
      <h3>Community</h3>
      <a href="community.html">Community</a>
      <a href="partner.html">Partner</a>
      <a href="upload.html">Upload</a>
    </div>

    <div>
      <h3>Help</h3>
      <a href="faq.html">FAQ</a>
      <a href="report.html">Report</a>
      <a href="dmca.html">DMCA</a>
    </div>

    <div>
      <h3>Legal</h3>
      <a href="privacy.html">Privacy</a>
      <a href="terms.html">Terms</a>
    </div>

  </div>

  <div class="copyright">
    © 2026 Tube. All rights reserved.
  </div>

</footer>

<script src="videos-data.js"></script>
<script src="app.js"></script>

</body>
</html>
