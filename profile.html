<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width,initial-scale=1">

    <title>Vexa — My Profile</title>

    <link
        rel="stylesheet"
        href="style.css">

    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="supabase-config.js"></script>
</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <button
            class="menu-btn"
            id="menuBtn">
            ☰
        </button>

        <a
            class="brand"
            href="index.html">
            Vexa
        </a>

        <div class="header-actions">

            <button
                class="icon-btn"
                id="themeBtn"
                aria-label="Theme">
                ◐
            </button>

            <a
                class="icon-btn"
                href="profile.html"
                aria-label="Profile">
                ●
            </a>

        </div>

    </div>

</header>


<div class="layout">

    <aside class="sidebar">

        <a
            class="side-link"
            href="index.html">
            Home
        </a>

        <a
            class="side-link"
            href="videos.html">
            Videos
        </a>

        <a
            class="side-link"
            href="photos.html">
            Photos
        </a>

        <a
            class="side-link"
            href="categories.html">
            Categories
        </a>

        <a
            class="side-link"
            href="tags.html">
            Tags
        </a>

        <a
            class="side-link"
            href="community.html">
            Community
        </a>

        <a
            class="side-link upload-link"
            href="upload.html">
            UPLOAD
        </a>

    </aside>

    <div
        class="overlay"
        id="overlay">
    </div>

    <main class="main">

        <div id="profilePage">
            Loading profile...
        </div>

    </main>

</div>


<script src="videos-data.js"></script>
<script src="app.js"></script>

<script>
document.addEventListener(
    "DOMContentLoaded",
    () => {
        if (typeof renderMyProfile === "function") {
            renderMyProfile();
        }
    }
);
</script>

</body>
</html>
