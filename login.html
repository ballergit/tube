<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Account - YourSite</title><link rel="stylesheet" href="styles.css"></head><body><div id="app"></div><script src="partials.js"></script><script>shell('Create an account or log in',`<p class="muted">Accounts are handled by the site's backend. This starter stores users in memory for development; use a real database before production.</p><div style="display:grid;grid-template-columns:1fr 1fr;gap:24px"><form id="register" class="card"><h2>Sign Up</h2><div class="field"><label>Username</label><input name="username" required></div><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" minlength="8" required></div><button class="btn primary">Create Account</button><p class="msg" id="rm"></p></form><form id="login" class="card"><h2>Log In</h2><div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button class="btn primary">Log In</button><p class="msg" id="lm"></p></form></div>`);document.getElementById('register').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();document.getElementById('rm').textContent=d.error||'Account created!';if(r.ok)setTimeout(()=>location.href='index.html',500)};document.getElementById('login').onsubmit=async e=>{e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();document.getElementById('lm').textContent=d.error||'Logged in!';if(r.ok)setTimeout(()=>location.href='index.html',500)};</script></body></html>
