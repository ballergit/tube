<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Login or create your YourSite account">
<title>Login — YourSite</title>

<link rel="stylesheet" href="style.css">

<style>
:root {
  --login-bg: #080808;
  --login-panel: #111111;
  --login-panel-2: #161616;
  --login-border: #292929;
  --login-text: #ffffff;
  --login-muted: #999999;
  --login-accent: #e50914;
  --login-accent-hover: #ff1b26;
  --login-input: #0d0d0d;
}

/* PAGE */
body {
  min-height: 100vh;
  margin: 0;
  padding: 0;
  background:
    radial-gradient(circle at top right, rgba(229, 9, 20, 0.12), transparent 35%),
    radial-gradient(circle at bottom left, rgba(229, 9, 20, 0.07), transparent 30%),
    var(--login-bg);
  color: var(--login-text);
  font-family: Arial, Helvetica, sans-serif;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* MAIN AUTH BOX */
.auth-page {
  width: 100%;
  max-width: 1100px;
  min-height: 650px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  overflow: hidden;
  border: 1px solid var(--login-border);
  border-radius: 18px;
  background: var(--login-panel);
  box-shadow:
    0 30px 80px rgba(0, 0, 0, 0.65),
    0 0 50px rgba(229, 9, 20, 0.05);
}

/* LEFT SIDE */
.auth-visual {
  position: relative;
  min-height: 650px;
  padding: 55px;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  overflow: hidden;

  background:
    linear-gradient(
      180deg,
      rgba(0, 0, 0, 0.15),
      rgba(0, 0, 0, 0.92)
    ),
    radial-gradient(
      circle at 75% 20%,
      rgba(229, 9, 20, 0.35),
      transparent 40%
    ),
    linear-gradient(135deg, #191919, #050505);
}

/* RED GLOW */
.auth-visual::before {
  content: "";
  position: absolute;
  width: 280px;
  height: 280px;
  top: -100px;
  right: -100px;
  border-radius: 50%;
  background: rgba(229, 9, 20, 0.18);
  filter: blur(70px);
}

/* DECORATIVE LINE */
.auth-visual::after {
  content: "";
  position: absolute;
  width: 150px;
  height: 4px;
  left: 55px;
  bottom: 210px;
  border-radius: 10px;
  background: var(--login-accent);
  box-shadow: 0 0 25px rgba(229, 9, 20, 0.5);
}

.auth-visual > div {
  position: relative;
  z-index: 2;
}

.auth-visual h1 {
  margin: 15px 0;
  font-size: 44px;
  line-height: 1.08;
  letter-spacing: -1.5px;
}

.auth-visual p {
  max-width: 430px;
  margin: 0;
  color: #b7b7b7;
  line-height: 1.7;
  font-size: 15px;
}

/* BRAND */
.auth-brand {
  color: #ffffff;
  font-size: 29px;
  font-weight: 800;
  letter-spacing: -0.8px;
}

.auth-brand::after {
  content: "";
  display: inline-block;
  width: 7px;
  height: 7px;
  margin-left: 5px;
  border-radius: 50%;
  background: var(--login-accent);
  box-shadow: 0 0 12px rgba(229, 9, 20, 0.7);
}

/* RIGHT FORM */
.auth-form {
  padding: 55px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  background: var(--login-panel);
}

.auth-form > * {
  max-width: 440px;
  width: 100%;
  margin-left: auto;
  margin-right: auto;
}

.auth-subtitle {
  color: var(--login-muted);
}

/* TABS */
.auth-tabs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  margin-bottom: 28px;
  border-bottom: 1px solid var(--login-border);
}

.auth-tab {
  position: relative;
  border: 0;
  background: transparent;
  color: #777777;
  padding: 15px 10px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.2s ease;
}

.auth-tab:hover {
  color: #ffffff;
}

.auth-tab.active {
  color: #ffffff;
}

.auth-tab.active::after {
  content: "";
  position: absolute;
  left: 20%;
  right: 20%;
  bottom: -1px;
  height: 2px;
  background: var(--login-accent);
  box-shadow: 0 0 12px rgba(229, 9, 20, 0.55);
}

/* FORM */
.auth-form-group {
  margin-bottom: 18px;
}

.auth-form-group label {
  display: block;
  margin-bottom: 8px;
  color: #dddddd;
  font-size: 13px;
  font-weight: 600;
}

.auth-form-group input {
  width: 100%;
  box-sizing: border-box;
  padding: 15px 16px;

  border: 1px solid var(--login-border);
  border-radius: 8px;

  background: var(--login-input);
  color: #ffffff;

  outline: none;
  font-size: 15px;

  transition:
    border-color 0.2s ease,
    box-shadow 0.2s ease,
    background 0.2s ease;
}

.auth-form-group input::placeholder {
  color: #666666;
}

.auth-form-group input:focus {
  border-color: var(--login-accent);
  background: #111111;
  box-shadow: 0 0 0 3px rgba(229, 9, 20, 0.10);
}

/* OPTIONS */
.auth-options {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;

  margin: 10px 0 20px;

  color: #999999;
  font-size: 13px;
}

.remember {
  display: flex;
  align-items: center;
  gap: 7px;
}

.remember input {
  accent-color: var(--login-accent);
}

.forgot {
  color: #bbbbbb;
  text-decoration: none;
}

.forgot:hover {
  color: #ffffff;
}

/* MAIN BUTTON */
.auth-submit {
  width: 100%;
  border: 0;
  cursor: pointer;

  padding: 15px;
  border-radius: 8px;

  background: var(--login-accent);
  color: #ffffff;

  font-size: 15px;
  font-weight: 700;

  box-shadow: 0 8px 25px rgba(229, 9, 20, 0.18);

  transition:
    background 0.2s ease,
    transform 0.2s ease,
    box-shadow 0.2s ease;
}

.auth-submit:hover {
  background: var(--login-accent-hover);
  box-shadow: 0 10px 30px rgba(229, 9, 20, 0.28);
  transform: translateY(-1px);
}

.auth-submit:disabled {
  opacity: 0.6;
  cursor: not-allowed;
  transform: none;
}

/* DIVIDER */
.auth-divider {
  display: flex;
  align-items: center;
  gap: 12px;

  margin: 25px auto;

  color: #555555;
  font-size: 11px;
  text-align: center;
}

.auth-divider::before,
.auth-divider::after {
  content: "";
  height: 1px;
  flex: 1;
  background: var(--login-border);
}

/* SOCIAL LOGIN */
.social-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.social-btn {
  padding: 13px 12px;

  border: 1px solid var(--login-border);
  border-radius: 8px;

  background: var(--login-panel-2);
  color: #eeeeee;

  cursor: pointer;

  font-size: 14px;
  font-weight: 600;

  transition:
    background 0.2s ease,
    border-color 0.2s ease;
}

.social-btn:hover {
  background: #202020;
  border-color: #444444;
}

/* MESSAGE */
.auth-message {
  margin-top: 18px;
  min-height: 20px;

  color: #aaaaaa;

  font-size: 13px;
  line-height: 1.5;
  text-align: center;
}

/* BACK LINK */
.back-home {
  display: block;

  margin-top: 24px;

  color: #777777;
  text-align: center;
  text-decoration: none;

  font-size: 13px;

  transition: color 0.2s ease;
}

.back-home:hover {
  color: #ffffff;
}

/* REGISTER */
.register-only {
  display: none;
}

/* TABLET */
@media (max-width: 850px) {
  body {
    padding: 20px;
    box-sizing: border-box;
  }

  .auth-page {
    min-height: 600px;
    grid-template-columns: 1fr;
  }

  .auth-visual {
    min-height: 260px;
    padding: 35px;
  }

  .auth-visual h1 {
    font-size: 34px;
  }

  .auth-visual::after {
    left: 35px;
    bottom: 55px;
  }

  .auth-form {
    padding: 40px 30px;
  }
}

/* MOBILE */
@media (max-width: 600px) {
  body {
    padding: 0;
    align-items: stretch;
  }

  .auth-page {
    min-height: 100vh;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }

  .auth-visual {
    min-height: 235px;
    padding: 30px 24px;
  }

  .auth-brand {
    font-size: 25px;
  }

  .auth-visual h1 {
    font-size: 30px;
    margin: 12px 0;
  }

  .auth-visual p {
    font-size: 14px;
    line-height: 1.6;
  }

  .auth-visual::after {
    left: 24px;
    bottom: 28px;
    width: 100px;
  }

  .auth-form {
    padding: 32px 22px 40px;
  }

  .social-buttons {
    grid-template-columns: 1fr 1fr;
  }
}

/* SMALL PHONES */
@media (max-width: 400px) {
  .auth-visual {
    min-height: 215px;
  }

  .auth-visual h1 {
    font-size: 27px;
  }

  .auth-form {
    padding: 28px 18px 35px;
  }

  .social-buttons {
    grid-template-columns: 1fr;
  }

  .auth-options {
    flex-direction: column;
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<div class="auth-page">

  <!-- LEFT SIDE -->
  <section class="auth-visual">
    <div>
      <div class="auth-brand">YourSite</div>

      <h1>Discover.<br>Watch.<br>Connect.</h1>

      <p>
        Create an account to save videos, build your favorites,
        and become part of the YourSite community.
      </p>
    </div>
  </section>


  <!-- RIGHT SIDE -->
  <section class="auth-form">

    <div class="auth-tabs">
      <button
        type="button"
        class="auth-tab active"
        id="loginTab">
        Login
      </button>

      <button
        type="button"
        class="auth-tab"
        id="registerTab">
        Register
      </button>
    </div>


    <form id="authForm">

      <div class="auth-form-group">
        <label for="email">Email</label>

        <input
          id="email"
          type="email"
          placeholder="you@example.com"
          autocomplete="email"
          required>
      </div>


      <div class="auth-form-group">
        <label for="password">Password</label>

        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required>
      </div>


      <div
        class="auth-form-group register-only"
        id="confirmPasswordGroup">

        <label for="confirmPassword">
          Confirm Password
        </label>

        <input
          id="confirmPassword"
          type="password"
          placeholder="Confirm your password"
          autocomplete="new-password">
      </div>


      <div
        class="auth-options"
        id="loginOptions">

        <label class="remember">
          <input type="checkbox" id="remember">
          Remember me
        </label>

        <a
          href="#"
          class="forgot"
          id="forgotPassword">
          Forgot password?
        </a>
      </div>


      <button
        type="submit"
        class="btn primary auth-submit"
        id="submitButton">
        Login
      </button>

    </form>


    <div class="auth-divider">
      OR
    </div>


    <div class="social-buttons">

      <button
        type="button"
        class="social-btn"
        id="googleLogin">
        Google
      </button>

      <button
        type="button"
        class="social-btn"
        id="githubLogin">
        GitHub
      </button>

    </div>


    <div
      class="auth-message"
      id="authMessage">
    </div>


    <a
      class="back-home"
      href="index.html">
      ← Back to YourSite
    </a>

  </section>

</div>


<!-- SUPABASE -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>


<script>
const authForm = document.getElementById("authForm");

const loginTab = document.getElementById("loginTab");
const registerTab = document.getElementById("registerTab");

const submitButton = document.getElementById("submitButton");

const confirmPasswordGroup =
  document.getElementById("confirmPasswordGroup");

const confirmPassword =
  document.getElementById("confirmPassword");

const loginOptions =
  document.getElementById("loginOptions");

const authMessage =
  document.getElementById("authMessage");

const forgotPassword =
  document.getElementById("forgotPassword");

const googleLogin =
  document.getElementById("googleLogin");

const githubLogin =
  document.getElementById("githubLogin");

let mode = "login";


/* MESSAGE */
function showMessage(message, error = false) {

  authMessage.textContent = message;

  authMessage.style.color =
    error ? "#ff5c66" : "#aaaaaa";
}


/* LOGIN / REGISTER MODE */
function setMode(newMode) {

  mode = newMode;

  const register = mode === "register";


  loginTab.classList.toggle(
    "active",
    !register
  );

  registerTab.classList.toggle(
    "active",
    register
  );


  confirmPasswordGroup.style.display =
    register ? "block" : "none";


  loginOptions.style.display =
    register ? "none" : "flex";


  submitButton.textContent =
    register ? "Create Account" : "Login";


  confirmPassword.required =
    register;


  showMessage("");
}


loginTab.addEventListener(
  "click",
  () => setMode("login")
);


registerTab.addEventListener(
  "click",
  () => setMode("register")
);


/* EMAIL LOGIN / REGISTER */
authForm.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;


    if (!email || !password) {

      showMessage(
        "Please enter your email and password.",
        true
      );

      return;
    }


    submitButton.disabled = true;


    try {

      /* REGISTER */
      if (mode === "register") {

        if (
          password !==
          confirmPassword.value
        ) {

          showMessage(
            "Passwords do not match.",
            true
          );

          submitButton.disabled = false;

          return;
        }


        const { error } =
          await supabaseClient.auth.signUp({
            email: email,
            password: password
          });


        if (error) {
          throw error;
        }


        showMessage(
          "Account created. Check your email if confirmation is required."
        );

      }


      /* LOGIN */
      else {

        const { error } =
          await supabaseClient.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {
          throw error;
        }


        showMessage(
          "Login successful. Redirecting..."
        );


        setTimeout(
          () => {
            window.location.href =
              "index.html";
          },
          700
        );
      }

    }

    catch (error) {

      showMessage(
        error.message ||
        "Something went wrong.",
        true
      );

    }


    submitButton.disabled = false;

  }
);


/* PASSWORD RESET */
forgotPassword.addEventListener(
  "click",
  async (event) => {

    event.preventDefault();


    const email =
      document.getElementById("email")
        .value
        .trim();


    if (!email) {

      showMessage(
        "Enter your email first.",
        true
      );

      return;
    }


    try {

      const { error } =
        await supabaseClient.auth
          .resetPasswordForEmail(
            email,
            {
              redirectTo:
                window.location.origin +
                "/reset-password.html"
            }
          );


      if (error) {
        throw error;
      }


      showMessage(
        "Password reset instructions have been sent to your email."
      );

    }

    catch (error) {

      showMessage(
        error.message ||
        "Unable to send reset email.",
        true
      );

    }

  }
);


/* GOOGLE */
googleLogin.addEventListener(
  "click",
  async () => {

    const { error } =
      await supabaseClient.auth.signInWithOAuth({
        provider: "google",

        options: {
          redirectTo:
            window.location.origin +
            "/index.html"
        }
      });


    if (error) {

      showMessage(
        error.message,
        true
      );

    }

  }
);


/* GITHUB */
githubLogin.addEventListener(
  "click",
  async () => {

    const { error } =
      await supabaseClient.auth.signInWithOAuth({
        provider: "github",

        options: {
          redirectTo:
            window.location.origin +
            "/index.html"
        }
      });


    if (error) {

      showMessage(
        error.message,
        true
      );

    }

  }
);
</script>

</body>
</html>
