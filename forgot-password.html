</div></div></header><div class="layout"><aside class="sidebar"><a class="side-link" href="index.html"><span>Home</span></a><a class="side-link" href="videos.html"><span>Videos</span></a><a class="side-link" href="photos.html"><span>Photos</span></a><a class="side-link" href="categories.html"><span>Categories</span></a><a class="side-link" href="tags.html"><span>Tags</span></a><a class="side-link" href="community.html"><span>Community</span></a><a class="side-link" href="upload.html"><span>UPLOAD</span></a></aside><main class="main auth-wrap login-page"><form class="login-form" id="forgotForm"><h1>Forgot Password</h1><p class="login-intro">Enter your email and we will send you a password reset link.</p><div class="field"><label>Email</label><input id="resetEmail" type="email" autocomplete="email" required></div><button class="btn primary login-submit" type="submit">Send Reset Link</button><p id="resetMsg" class="muted" role="status"></p><p><a href="login.html">Back to Login</a></p></form></main></div><script src="app.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const c=window.supabaseClient,f=document.getElementById('forgotForm'),m=document.getElementById('resetMsg');if(!c){m.textContent='Supabase is not connected.';return;}f.onsubmit=async e=>{e.preventDefault();m.textContent='Sending…';const email=document.getElementById('resetEmail').value.trim();const redirectTo=location.origin+location.pathname.replace('forgot-password.html','reset-password.html');const {error}=await c.auth.resetPasswordForEmail(email,{redirectTo});m.textContent=error?error.message:'Check your email for the password reset link.';};});</script></body></html>
