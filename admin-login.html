<main class="main auth-wrap">
<form class="form" id="adminLoginForm">
<h1>Admin Login</h1>
<p class="muted">Sign in with your authorized GitHub account to access the Vexa admin portal.</p>
<button class="btn primary github-login-btn" type="button" id="githubAdminLogin">Continue with GitHub</button>
<p id="adminLoginMsg" class="muted" role="status"></p>
<button class="btn" type="button" id="switchAdminAccount" hidden>Sign out and use another GitHub account</button>
<p><a href="login.html">Go to regular user login</a></p>
</form>
</main>
</div>

<script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const client=window.supabaseClient, msg=document.getElementById('adminLoginMsg'), btn=document.getElementById('githubAdminLogin'), switchBtn=document.getElementById('switchAdminAccount');
  if(!client){msg.textContent='Supabase is not connected.';return;}
  const next='admin.html';
  const checkAdmin=async()=>{
    const {data:isAdmin,error}=await client.rpc('is_vexa_admin');
    if(error) return {ok:false,error};
    return {ok:isAdmin===true,error:null};
  };
  const {data:{session}}=await client.auth.getSession();
  const params=new URLSearchParams(location.search);
  if(params.get('error_description')) msg.textContent='GitHub sign-in failed: '+params.get('error_description').replace(/\+/g,' ');
  if(session?.user){
    const result=await checkAdmin();
    if(result.ok){location.replace(next);return;}
    msg.textContent='This GitHub account is signed in, but it is not authorized as a Vexa administrator. Use the GitHub account whose email is Gnballer96@gmail.com.';
    switchBtn.hidden=false;
  }
  btn.onclick=async()=>{
    msg.textContent='Opening GitHub…';btn.disabled=true;
    const redirectTo=new URL('admin-login.html',window.location.href).href;
    const {error}=await client.auth.signInWithOAuth({provider:'github',options:{redirectTo}});
    if(error){msg.textContent='GitHub sign-in could not start: '+error.message+'. Make sure GitHub is enabled in Supabase Authentication → Providers and this Admin Login URL is in Supabase Authentication → URL Configuration → Redirect URLs.';btn.disabled=false;}
  };
  switchBtn.onclick=async()=>{await client.auth.signOut();location.reload();};
});
</script>
</body>
</html>
