<main class="main auth-wrap">
<form class="form" id="adminLoginForm">
<h1>Admin Login</h1>
<p class="muted">Sign in with the account that has administrator access.</p>
<div class="field"><label>Email</label><input id="adminEmail" type="email" autocomplete="username" required></div>
<div class="field"><label>Password</label><input id="adminPassword" type="password" autocomplete="current-password" required></div>
<button class="btn primary" type="submit" id="adminLoginBtn">Log in</button>
<p id="adminLoginMsg" class="muted" role="status"></p>
<button class="btn" type="button" id="switchAdminAccount" hidden>Sign out and use another account</button>
<p><a href="login.html">Go to regular user login</a></p>
</form>
</main>
</div>

<script src="app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const client=window.supabaseClient, form=document.getElementById('adminLoginForm'), msg=document.getElementById('adminLoginMsg');
  if(!client){msg.textContent='Supabase is not connected.';return;}
  const params=new URLSearchParams(location.search);
  const next='admin.html';
  const switchBtn=document.getElementById('switchAdminAccount');
  switchBtn.onclick=async()=>{await client.auth.signOut();location.reload();};
  const {data:{session}}=await client.auth.getSession();
  if(session?.user){
    const {data:isAdmin,error}=await client.rpc('is_vexa_admin');
    if(!error && isAdmin===true){location.replace(next);return;}
    if(params.get('switch')==='1') await client.auth.signOut();
    else msg.textContent='This signed-in account is not an administrator. Sign out and use your admin account.';if(switchBtn)switchBtn.hidden=false;
  }
  form.onsubmit=async e=>{
    e.preventDefault();msg.textContent='Signing in…';
    const email=document.getElementById('adminEmail').value.trim(), password=document.getElementById('adminPassword').value;
    const {error}=await client.auth.signInWithPassword({email,password});
    if(error){msg.textContent=error.message;return;}
    const {data:isAdmin,error:adminError}=await client.rpc('is_vexa_admin');
    if(adminError){await client.auth.signOut();msg.textContent='Admin access could not be verified: '+adminError.message;return;}
    if(isAdmin!==true){await client.auth.signOut();msg.textContent='This account is a normal user account, not an admin account.';return;}
    msg.textContent='Admin verified. Opening portal…';location.replace(next);
  };
});
</script>
</body>
